[project]
name = "trinity-model-router"
version = "0.1.0"
description = "TRINITY MODEL ROUTER - AI model routing, TCU accounting, and failover"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.104.0",
    "pydantic>=2.0.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trinity_router"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
