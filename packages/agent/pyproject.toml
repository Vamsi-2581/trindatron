[project]
name = "trinity-agent"
version = "0.1.0"
description = "TRINITY AGENT - Agentic computer-use layer for TRINDATRON"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.40.0",
    "anthropic>=0.34.0",
    "playwright>=1.45.0",
    "pyautogui>=0.9.54",
    "duckduckgo-search>=6.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
    "trinity-sandbox",
    "trinity-model-router",
]

[tool.uv.sources]
trinity-sandbox = { path = "../sandbox" }
trinity-model-router = { path = "../model-router" }

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Same pattern as trinity-sandbox (src/trinity_sandbox) and
# trinity-model-router (src/trinity_router): a single namespaced package
# under src/. agent.py, config.py, permissions/, security/, and tools/ now
# live under src/trinity_agent/, and every internal import in this codebase
# is written against that namespace (e.g. `from trinity_agent.permissions.
# gateway import ...`), so the installed modules are trinity_agent.agent,
# trinity_agent.permissions.*, trinity_agent.security.*, trinity_agent.tools.*
# — no more top-level agent/config/permissions/security/tools collision risk.
[tool.hatch.build.targets.wheel]
packages = ["src/trinity_agent"]
